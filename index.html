<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111111" />
    <title>Umbra — a minimalist launcher for Windows</title>
    <meta
      name="description"
      content="Umbra is a minimalist launcher for Windows. Press Alt + Space and everything on your drive is in one list."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Umbra — a minimalist launcher for Windows" />
    <meta
      property="og:description"
      content="Press Alt + Space and everything on your drive is in one list."
    />
    <meta property="og:image" content="/umbra-app.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Google+Sans+Flex:opsz,wght@8..144,100..1000&display=swap"
      rel="stylesheet"
    />
    <script>
      // Reveal animations start hidden only when JS is there to un-hide them,
      // so a failed bundle or a crawler never sees a blank page.
      document.documentElement.classList.add('js')
      // A reload should open at the top, not restore the last scroll offset.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script></body>
</html>
